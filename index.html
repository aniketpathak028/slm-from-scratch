<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TinyStories SLM</title>

  <!-- Local COOP/COEP Service Worker for Cross-Origin Isolation -->
  <script src="./coi-serviceworker.js"></script>

  <!-- ONNX Runtime Web -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #212121; color: #ececec; display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar */
    .sidebar { width: 260px; background-color: #171717; display: flex; flex-direction: column; padding: 12px; border-right: 1px solid #2f2f2f; }
    .new-chat-btn { display: flex; align-items: center; gap: 10px; background: transparent; border: 1px solid #383838; color: #fff; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: background 0.2s; }
    .new-chat-btn:hover { background: #212121; }
    .sidebar-history { flex: 1; margin-top: 20px; overflow-y: auto; }
    .history-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; font-size: 14px; color: #b4b4b4; border-radius: 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-item.active, .history-item:hover { background: #212121; color: #fff; }

    /* Main Chat Container */
    .main-chat { flex: 1; display: flex; flex-direction: column; height: 100vh; background-color: #212121; position: relative; }
    .header { padding: 14px 20px; font-weight: 600; font-size: 16px; border-bottom: 1px solid #2f2f2f; display: flex; justify-content: space-between; align-items: center; color: #e3e3e3; }
    .status-badge { font-size: 12px; padding: 4px 10px; border-radius: 12px; background: #383838; color: #e3e3e3; font-weight: normal; }

    /* Messages Box */
    .messages-container { flex: 1; overflow-y: auto; padding: 20px 0; display: flex; flex-direction: column; gap: 24px; scroll-behavior: smooth; }
    .message-row { display: flex; width: 100%; max-width: 768px; margin: 0 auto; padding: 0 20px; gap: 16px; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: bold; font-size: 14px; }
    .user-avatar { background-color: #5436da; color: #fff; }
    .bot-avatar { background-color: #10a37f; color: #fff; }
    .message-content { flex: 1; line-height: 1.6; font-size: 15px; color: #d1d5db; padding-top: 2px; white-space: pre-wrap; word-break: break-word; }

    /* Welcome Card */
    .welcome-container { margin: auto; text-align: center; max-width: 500px; padding: 20px; }
    .welcome-container h1 { font-size: 28px; margin-bottom: 10px; color: #fff; }
    .welcome-container p { font-size: 14px; color: #9b9b9b; }

    /* Input Bar */
    .input-wrapper { max-width: 768px; width: 100%; margin: 0 auto; padding: 0 20px 24px 20px; }
    .input-box { background: #2f2f2f; border: 1px solid #383838; border-radius: 16px; display: flex; align-items: flex-end; padding: 10px 14px; transition: border-color 0.2s; }
    .input-box:focus-within { border-color: #676767; }
    textarea { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-family: inherit; font-size: 15px; resize: none; max-height: 150px; min-height: 24px; line-height: 24px; }
    .send-btn { background: #676767; color: #212121; border: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s; margin-left: 8px; }
    .send-btn.active { background: #ffffff; color: #000; }
    .send-btn:disabled { background: #383838; color: #676767; cursor: not-allowed; }

    /* Cursor */
    .cursor { display: inline-block; width: 8px; height: 16px; background: #10a37f; margin-left: 2px; animation: blink 1s infinite; vertical-align: middle; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    @media (max-width: 768px) { .sidebar { display: none; } }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <button class="new-chat-btn" onclick="resetChat()">
      <i data-lucide="plus"></i> New story
    </button>
    <div class="sidebar-history">
      <div class="history-item active">
        <i data-lucide="message-square"></i> TinyStories SLM
      </div>
    </div>
  </div>

  <!-- Main Chat -->
  <div class="main-chat">
    <div class="header">
      <span>TinyStories SLM</span>
      <span id="status-badge" class="status-badge">Loading model...</span>
    </div>

    <div class="messages-container" id="messages-container">
      <div class="welcome-container" id="welcome-card">
        <h1>What story shall we tell?</h1>
        <p>Enter a prompt below to trigger autoregressive text generation locally in your browser.</p>
      </div>
    </div>

    <div class="input-wrapper">
      <div class="input-box">
        <textarea id="user-input" rows="1" placeholder="Once upon a time..." disabled oninput="handleInput()"></textarea>
        <button id="send-btn" class="send-btn" disabled onclick="sendMessage()">
          <i data-lucide="arrow-up"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Module Script -->
  <script type="module">
    import { getEncoding } from 'https://cdn.jsdelivr.net/npm/js-tiktoken@1.0.12/+esm';

    let session = null;
    let encoder = null;
    let isGenerating = false;
    let stopRequested = false;

    // Load Lucide icons
    if (window.lucide) lucide.createIcons();

    window.handleInput = function() {
      const textarea = document.getElementById("user-input");
      const btn = document.getElementById("send-btn");
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 150) + 'px';
      
      if (textarea.value.trim().length > 0 && !isGenerating) {
        btn.classList.add("active");
      } else if (!isGenerating) {
        btn.classList.remove("active");
      }
    };

    document.getElementById("user-input").addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        if (!isGenerating && this.value.trim().length > 0) {
          window.sendMessage();
        }
      }
    });

    async function init() {
      const statusBadge = document.getElementById("status-badge");
      try {
        encoder = getEncoding("gpt2");
        ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/";
        session = await ort.InferenceSession.create('./model_quant.onnx', { 
          executionProviders: ['wasm'] 
        });

        statusBadge.innerText = "Model Ready";
        statusBadge.style.background = "#10a37f";
        document.getElementById("user-input").disabled = false;
        document.getElementById("send-btn").disabled = false;
      } catch (e) {
        console.error("Initialization error:", e);
        statusBadge.innerText = "Load Failed";
        statusBadge.style.background = "#ef4444";
      }
    }

    window.sendMessage = async function() {
      const inputEl = document.getElementById("user-input");
      const text = inputEl.value.trim();
      if (!text || isGenerating) return;

      isGenerating = true;
      stopRequested = false;
      setStopButtonUI(true);
      
      const welcomeCard = document.getElementById("welcome-card");
      if (welcomeCard) welcomeCard.style.display = "none";

      appendUserMessage(text);
      inputEl.value = "";
      inputEl.style.height = 'auto';

      const responseEl = createBotMessageElement();
      const cursor = document.createElement("span");
      cursor.className = "cursor";
      responseEl.appendChild(cursor);

      let tokens = Array.from(encoder.encode(text));
      const maxNewTokens = 120;

      for (let i = 0; i < maxNewTokens; i++) {
        if (stopRequested) {
          console.log("Generation halted by user.");
          break;
        }

        const context = tokens.slice(-128); // block_size = 128
        const inputTensor = new ort.Tensor('int64', BigInt64Array.from(context.map(x => BigInt(x))), [1, context.length]);
        
        const results = await session.run({ input_ids: inputTensor });
        const logits = results.logits.data;
        const vocabSize = 50257;
        const lastTokenLogits = Array.from(logits.slice(logits.length - vocabSize));

        // Argmax selection
        let nextToken = 0;
        let maxVal = -Infinity;
        for (let j = 0; j < vocabSize; j++) {
          if (lastTokenLogits[j] > maxVal) {
            maxVal = lastTokenLogits[j];
            nextToken = j;
          }
        }

        tokens.push(nextToken);
        
        const currentText = encoder.decode(tokens);
        responseEl.innerText = currentText;
        responseEl.appendChild(cursor);
        
        scrollToBottom();

        if (nextToken === 50256) break; // EOS Token ID
        await new Promise(r => setTimeout(r, 10));
      }

      cursor.remove();
      isGenerating = false;
      stopRequested = false;
      setStopButtonUI(false);
    };

    window.stopGeneration = function() {
      if (isGenerating) {
        stopRequested = true;
      }
    };

    function setStopButtonUI(active) {
      const btn = document.getElementById("send-btn");
      if (active) {
        btn.innerHTML = `<i data-lucide="square" style="width:14px;height:14px;fill:currentColor;"></i>`;
        btn.onclick = window.stopGeneration;
        btn.disabled = false;
        btn.classList.add("active");
      } else {
        btn.innerHTML = `<i data-lucide="arrow-up"></i>`;
        btn.onclick = window.sendMessage;
        btn.disabled = false;
        btn.classList.remove("active");
      }
      if (window.lucide) lucide.createIcons();
    }

    function appendUserMessage(text) {
      const container = document.getElementById("messages-container");
      const row = document.createElement("div");
      row.className = "message-row";
      row.innerHTML = `
        <div class="avatar user-avatar">U</div>
        <div class="message-content">${escapeHtml(text)}</div>
      `;
      container.appendChild(row);
      scrollToBottom();
    }

    function createBotMessageElement() {
      const container = document.getElementById("messages-container");
      const row = document.createElement("div");
      row.className = "message-row";
      
      const avatar = document.createElement("div");
      avatar.className = "avatar bot-avatar";
      avatar.innerText = "AI";

      const content = document.createElement("div");
      content.className = "message-content";

      row.appendChild(avatar);
      row.appendChild(content);
      container.appendChild(row);

      return content;
    }

    function scrollToBottom() {
      const container = document.getElementById("messages-container");
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    window.resetChat = function() {
      if (isGenerating) return;
      document.getElementById("messages-container").innerHTML = `
        <div class="welcome-container" id="welcome-card">
          <h1>What story shall we tell?</h1>
          <p>Enter a prompt below to trigger autoregressive text generation locally in your browser.</p>
        </div>
      `;
    };

    init();
  </script>
</body>
</html>
